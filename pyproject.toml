[project]
name = "security-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "snyadav-ds-ml", email = "yadavsneha280@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
security-project = "security_project:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
